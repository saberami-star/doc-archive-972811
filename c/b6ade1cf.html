  <style id="lock-style">
    * { box-sizing: border-box; }

      color: #ffffff;

      color: #a8a69e;
    }
    .vault-input {
      width: 100%;
      padding: 11px 13px;
      border-radius: 8px;
      border: 1px solid #3d3c37;
      background: #141413;
      color: #ffffff;
      font-size: 14px;
      margin-bottom: 12px;

    .vault-btn {
      width: 100%;
      padding: 11px 16px;
      border-radius: 8px;
      border: none;
      background: #d97757;
      color: #ffffff;
      font-size: 14px;

      font-size: 12.5px;
      color: #f87171;
      display: none;

    var STORAGE_SLOT = "sv_k_v1";

    function b64ToBytes(b64) {
      var std = b64.replace(/-/g, "+").replace(/_/g, "/");
      while (std.length % 4 !== 0) std += "=";
      var bin = atob(std);
      var out = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
      return out;
    }

    function extractKeyInput(raw) {
      if (!raw) return "";
      var s = String(raw).trim();
      var m = s.match(/(?:[#&?]k=)([A-Za-z0-9_-]{32,64})/);
      if (m && m[1]) return m[1];
      return s;
    }

    function readStoredKey() {
      try { var k = localStorage.getItem(STORAGE_SLOT); if (k) return k; } catch (e) {}
      try { var s = sessionStorage.getItem(STORAGE_SLOT); if (s) return s; } catch (e) {}
      return "";
    }

    function saveKey(k) {
      var saved = false;
      try { localStorage.setItem(STORAGE_SLOT, k); saved = true; } catch (e) {}
      try { sessionStorage.setItem(STORAGE_SLOT, k); saved = true; } catch (e) {}
      return saved;
    }

    var rawHash = window.location.hash ? window.location.hash.slice(1) : "";
    var targetAnchor = "";
    var hashKey = "";
    var hashAsk = false;

    if (rawHash && (rawHash.indexOf("k=") === 0 || rawHash.indexOf("&k=") !== -1)) {
      var hp = new URLSearchParams(rawHash);
      hashKey = extractKeyInput(hp.get("k") || "");
      targetAnchor = (hp.get("go") || "").trim();
      if (hp.get("ask") === "1") hashAsk = true;
      if (hashKey) {
        saveKey(hashKey);
        if (window.history && window.history.replaceState) {
          var searchStr = window.location.search || "";
          if (hashAsk && searchStr.indexOf("ask=1") === -1) {
            searchStr += (searchStr ? "&" : "?") + "ask=1";
          }
          var cleanUrl = window.location.pathname + searchStr + (targetAnchor ? "#" + targetAnchor : "");
          window.history.replaceState(null, "", cleanUrl);
        }
      }
    } else if (rawHash) {
      targetAnchor = rawHash;
    }

    function showGate(showError) {
      var g = document.getElementById("vault-gate");
      var e = document.getElementById("vault-err");
      if (g) g.style.display = "block";
      if (e) e.style.display = showError ? "block" : "none";
    }

    function unlockWithKey(candidateKey, isManual) {
      var cleanKey = extractKeyInput(candidateKey);
      if (!cleanKey) {
        showGate(false);
        return;
      }
      var keyBytes;
      try {
        keyBytes = b64ToBytes(cleanKey);
        if (keyBytes.length !== 32) throw new Error("len");
      } catch (err) {
        showGate(Boolean(isManual));
        return;
      }

      crypto.subtle.importKey("raw", keyBytes, { name: "AES-GCM" }, false, ["decrypt"])
        .then(function(ck) {
          return crypto.subtle.decrypt(
            { name: "AES-GCM", iv: b64ToBytes(IV_B64), tagLength: 128 },
            ck,
            b64ToBytes(CT_B64)
          );
        })
        .then(function(plainBuf) {
          var persisted = saveKey(cleanKey);
          var jsonStr = new TextDecoder("utf-8").decode(plainBuf);
          var data = JSON.parse(jsonStr);

          var lockStyle = document.getElementById("lock-style");
          if (lockStyle && lockStyle.parentNode) lockStyle.parentNode.removeChild(lockStyle);

          var st = document.createElement("style");
          st.textContent = data.css || "";
          document.head.appendChild(st);

          if (data.title) document.title = data.title;
          document.body.innerHTML = data.bodyHtml || "";

          if (!persisted) {
            var links = document.querySelectorAll("a[href]");
            for (var i = 0; i < links.length; i++) {
              var h = links[i].getAttribute("href") || "";
              if (h && !/^(https?:|mailto:|tel:|#)/i.test(h)) {
                links[i].setAttribute("href", h.split("#")[0] + "#k=" + encodeURIComponent(cleanKey));
              }
            }
          }

          if (data.js) {
            var sc = document.createElement("script");
            sc.textContent = data.js;
            document.body.appendChild(sc);
          }

          if (targetAnchor) {
            setTimeout(function() {
              var el = document.getElementById(targetAnchor);
              if (el && el.scrollIntoView) el.scrollIntoView();
            }, 40);
          }
        })
        .catch(function() {
          showGate(true);
        });
    }

    var form = document.getElementById("vault-form");
    if (form) {
      form.addEventListener("submit", function(ev) {
        ev.preventDefault();
        var inp = document.getElementById("vault-key-input");
        unlockWithKey(inp ? inp.value : "", true);
      });
    }

    var activeKey = hashKey || readStoredKey();
    if (activeKey) {
      unlockWithKey(activeKey, false);
    } else {
      showGate(false);
    }
  })();
