  <style id="lock-style">

      color: #ffffff;

    .vault-input {
      width: 100%;
      padding: 11px 13px;
      border-radius: 8px;
      border: 1px solid #3d3c37;
      background: #141413;
      color: #ffffff;
      font-size: 14px;
      margin-bottom: 12px;

      width: 100%;
      padding: 11px 16px;
      border-radius: 8px;
      border: none;
      background: #d97757;
      color: #ffffff;
      font-size: 14px;

      color: #f87171;

    var form = document.getElementById("vault-form");
    if (form) {
      form.addEventListener("submit", function(ev) {
        ev.preventDefault();
        var inp = document.getElementById("vault-key-input");
        unlockWithKey(inp ? inp.value : "", true);
      });
    }

    var activeKey = hashKey || readStoredKey();
    if (activeKey) {
      unlockWithKey(activeKey, false);
    } else {
      showGate(false);
    }
  })();
  </script>
</body>
</html>
