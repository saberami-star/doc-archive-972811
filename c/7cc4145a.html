  <style id="lock-style">
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;

      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;

      color: #f3f1ea;

    .vault-card {
      width: 100%;
      max-width: 440px;
      background: #1f1f1d;
      border: 1px solid #33322e;

      padding: 28px 26px;

      text-align: center;
    }
    .vault-card h1 {
      margin: 0 0 8px;
      font-size: 20px;
      color: #ffffff;
    }
    .vault-card p {
      margin: 0 0 18px;
      font-size: 13.5px;
      line-height: 1.55;
      color: #a8a69e;
    }
    .vault-input {
      width: 100%;
      padding: 11px 13px;
      border-radius: 8px;
      border: 1px solid #3d3c37;
      background: #141413;
      color: #ffffff;
      font-size: 14px;
      margin-bottom: 12px;
    }
    .vault-btn {
      width: 100%;
      padding: 11px 16px;
      border-radius: 8px;
      border: none;
      background: #d97757;
      color: #ffffff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    .vault-err {
      margin-top: 12px;
      font-size: 12.5px;
      color: #f87171;
      display: none;
    }

        .catch(function() {
          showGate(true);
        });
    }

    var form = document.getElementById("vault-form");
    if (form) {
      form.addEventListener("submit", function(ev) {
        ev.preventDefault();
        var inp = document.getElementById("vault-key-input");
        unlockWithKey(inp ? inp.value : "", true);
      });
    }

    var activeKey = hashKey || readStoredKey();
    if (activeKey) {
      unlockWithKey(activeKey, false);
    } else {
      showGate(false);
    }
  })();
  </script>
</body>
</html>
