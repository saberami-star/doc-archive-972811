  <style id="lock-style">
    * { box-sizing: border-box; }

    .vault-card {

      background: #1f1f1d;

      margin: 0 0 8px;
      font-size: 20px;
      color: #ffffff;
    }
    .vault-card p {
      margin: 0 0 18px;
      font-size: 13.5px;
      line-height: 1.55;
      color: #a8a69e;
    }
    .vault-input {
      width: 100%;
      padding: 11px 13px;
      border-radius: 8px;
      border: 1px solid #3d3c37;
      background: #141413;
      color: #ffffff;
      font-size: 14px;
      margin-bottom: 12px;
    }
    .vault-btn {
      width: 100%;
      padding: 11px 16px;
      border-radius: 8px;
      border: none;
      background: #d97757;
      color: #ffffff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

      margin-top: 12px;
      font-size: 12.5px;
      color: #f87171;
      display: none;

    function b64ToBytes(b64) {
      var std = b64.replace(/-/g, "+").replace(/_/g, "/");
      while (std.length % 4 !== 0) std += "=";
      var bin = atob(std);
      var out = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
      return out;

    function extractKeyInput(raw) {
      if (!raw) return "";
      var s = String(raw).trim();
      var m = s.match(/(?:[#&?]k=)([A-Za-z0-9_-]{32,64})/);
      if (m && m[1]) return m[1];
      return s;
    }

    function readStoredKey() {

      try { var s = sessionStorage.getItem(STORAGE_SLOT); if (s) return s; } catch (e) {}
      return "";
    }

    function saveKey(k) {
      var saved = false;
      try { localStorage.setItem(STORAGE_SLOT, k); saved = true; } catch (e) {}

      if (hp.get("ask") === "1") hashAsk = true;

      form.addEventListener("submit", function(ev) {
        ev.preventDefault();
        var inp = document.getElementById("vault-key-input");
        unlockWithKey(inp ? inp.value : "", true);
      });
    }

    var activeKey = hashKey || readStoredKey();
    if (activeKey) {
      unlockWithKey(activeKey, false);
    } else {
      showGate(false);
    }
  })();
  </script>
</body>
</html>
