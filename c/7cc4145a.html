  <style id="lock-style">

    .vault-card {

      color: #ffffff;

      font-size: 13.5px;

      color: #a8a69e;
    }
    .vault-input {
      width: 100%;
      padding: 11px 13px;
      border-radius: 8px;
      border: 1px solid #3d3c37;
      background: #141413;
      color: #ffffff;
      font-size: 14px;
      margin-bottom: 12px;

    .vault-btn {
      width: 100%;
      padding: 11px 16px;
      border-radius: 8px;
      border: none;
      background: #d97757;
      color: #ffffff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;

      font-size: 12.5px;
      color: #f87171;
      display: none;

    function b64ToBytes(b64) {
      var std = b64.replace(/-/g, "+").replace(/_/g, "/");
      while (std.length % 4 !== 0) std += "=";
      var bin = atob(std);
      var out = new Uint8Array(bin.length);

    function saveKey(k) {

    }

    var form = document.getElementById("vault-form");
    if (form) {
      form.addEventListener("submit", function(ev) {
        ev.preventDefault();
        var inp = document.getElementById("vault-key-input");
        unlockWithKey(inp ? inp.value : "", true);
      });
    }

    var activeKey = hashKey || readStoredKey();
    if (activeKey) {
      unlockWithKey(activeKey, false);
    } else {
      showGate(false);
    }
  })();
  </script>
</body>
</html>
